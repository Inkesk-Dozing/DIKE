[package]
name = "dike-envoy-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Inkesk <contact@inkesk.com>"]
description = "High-performance Envoy WebAssembly (proxy-wasm) filter for Distributed Idempotency Key Engine (DIKE)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proxy-wasm = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

